<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101816" />
  <title>Мои дела — TG Notification</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header><h1>Мои задачи</h1></header>
    <button id="add-button" class="add-button" disabled>＋ Создать задачу</button>
    <section id="task-list" class="task-list" aria-live="polite"></section>
    <details id="completed-tasks" open hidden>
      <summary>Завершённые <span id="completed-count"></span></summary>
      <div id="completed-list" class="task-list"></div>
    </details>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <dialog id="task-dialog" aria-labelledby="create-heading">
    <form id="task-form">
      <div class="dialog-head"><h2 id="create-heading">Новая задача</h2><button type="button" id="close-dialog" class="close" aria-label="Закрыть">×</button></div>
      <label for="title">Название</label><input id="title" name="title" required maxlength="200" placeholder="Что нужно сделать?" />
      <div id="create-priority"></div>
      <label class="check-label"><input id="remind" type="checkbox" checked /> Напоминание</label>
      <div id="schedule">
        <div class="date-time"><div><label for="day">Дата</label><input type="date" id="day" required></div>
        <div><label for="time">Время</label><input type="time" id="time" required></div></div>
        <small id="zone"></small>
        <label class="check-label"><input type="checkbox" id="weekly"> Раз в неделю</label>
      </div>
      <button class="submit" type="submit">Сохранить задачу</button>
      <p id="form-error" class="error" role="alert" hidden></p>
    </form>
  </dialog>
  <dialog id="move-dialog" aria-labelledby="move-heading">
    <form id="move-form">
      <div class="dialog-head"><h2 id="move-heading">Перенести задачу</h2><button type="button" id="move-close" class="close" aria-label="Закрыть">×</button></div>
      <p id="move-task-title" class="muted"></p>
      <label for="move-reason">Что мешает? (необязательно)</label>
      <select id="move-reason"><option value="busy">Занят другим</option><option value="tired">Нет сил</option><option value="stuck">Не знаю, с чего начать</option><option value="avoid">Не хочу сейчас</option></select>
      <div class="move-presets">
        <button type="button" data-minutes="10">10 мин</button>
        <button type="button" data-minutes="30">30 мин</button>
        <button type="button" data-minutes="60">1 час</button>
        <button type="button" id="move-tomorrow">Завтра, 09:00</button>
      </div>
      <label for="move-time">Или выбрать дату и время</label>
      <input id="move-time" type="datetime-local" required>
      <button class="submit" type="submit">Перенести</button>
      <p class="error" id="move-error" role="alert" hidden></p>
    </form>
  </dialog>
</body>
</html>
